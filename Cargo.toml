[package]
name = "asciidocr"
version = "0.3.0-rc.1"
readme = "README.md"
license = "MIT"
edition = "2024"
description = "A pure-Rust CLI and library for processing and converting asciidoc files"
documentation = "https://docs.rs/asciidocr"
repository = "https://github.com/delfanbaum/asciidocr"
keywords = ["asciidoc", "lightweight-markup", "htmlbook", "asciidocr"]
categories = ["command-line-utilities", "parser-implementations", "text-processing"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = {version="1.0.89", optional=true}
chrono = {version="0.4.42", features=["serde"]}
clap = {version = "4.5.20", features=["derive"], optional=true}
docx-rs = {version="=0.4.22", optional=true}
log = "0.4.22"
minijinja = {version = "3.1.0", features=["serde"]}
once_cell = "1.20.2"
regex = "1.11.1"
serde = {version = "1.0.210", features=["derive"]}
serde_json = {version="1.0.128", optional=true}
simple_logger = {version = "5.0.0", features=["colors", "stderr"], optional=true}
thiserror = "2.0.12"

[dev-dependencies]
assert-json-diff = "2.0.2"
# the tests compare graphs as JSON whatever the features
serde_json = "1.0.128"
image = "0.25.6"
logtest = "2.0.0"
rstest = "0.29.0"
tempfile = "3.14.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
roxmltree = "0.21.2"
scraper = "0.29"
pretty_assertions = "1.4"

[[bin]]
name = "asciidocr"
path = "src/bin/asciidocr/main.rs"
required-features = ["cli"]

# runs the binary, so it needs it built
[[test]]
name = "cli_tests"
required-features = ["cli"]

[features]
default = ["cli"]
# the command-line tool; a library user can leave it out with `default-features = false`
cli = ["dep:anyhow", "dep:clap", "dep:simple_logger"]
docx = ["dep:docx-rs"]
json = ["dep:serde_json"]

[lints.clippy]
# directory modules use `foo/mod.rs`, not `foo.rs` next to `foo/`
self_named_module_files = "warn"
