name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --all-features --verbose
    - name: Run tests
      run: cargo test --all-features --verbose

  # The full fuzz run (every fixture cut off and mutated, checked for panics and hangs; see
  # tests/fuzz_tests.rs). The quick one runs with the other tests. A debug build, so arithmetic
  # overflow panics too.
  fuzz:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Run the full fuzz run
      run: cargo test --all-features --test fuzz_tests -- --ignored
